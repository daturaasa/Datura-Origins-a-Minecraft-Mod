plugins {
	id 'fabric-loom'
}

base {
	archivesName = 'datura-origins-fabric-1.21.1'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"datura_origins" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		resources {
			srcDir rootProject.file('shared-resources')
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mc1211_version}"
	mappings "net.fabricmc:yarn:${mc1211_yarn}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${mc1211_fabric_api}"

	implementation project(':core')
	include project(':core')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
